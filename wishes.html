<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温馨祝福 - 母亲节快乐</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Dancing+Script:wght@700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --rose:#ff2d55; --pink:#ff85a2; --gold:#ffd700; --purple:#9b59b6; --bg:#0a0015; }
        body { font-family:'Noto Serif SC',serif; background:var(--bg); min-height:100vh; color:#fff5f9; overflow-x:hidden; }
        .stars { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
        .star { position:absolute; background:white; border-radius:50%; animation:twinkle var(--dur) ease-in-out infinite; }
        @keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:0.8;} }
        nav { position:fixed; top:0; left:0; width:100%; z-index:1000; background:rgba(10,0,21,0.95); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,45,85,0.3); padding:15px 0; }
        nav ul { display:flex; justify-content:center; gap:20px; list-style:none; flex-wrap:wrap; padding:0 10px; }
        nav a { color:#fff5f9; text-decoration:none; font-size:1rem; transition:all 0.3s; padding:8px 16px; border-radius:30px; white-space:nowrap; }
        nav a:hover, nav a.active { background:linear-gradient(135deg,var(--rose),var(--purple)); box-shadow:0 5px 20px rgba(255,45,85,0.4); }
        .container { max-width:900px; margin:0 auto; padding:100px 20px 40px; position:relative; z-index:10; }
        h1 { text-align:center; font-size:2.5rem; margin-bottom:40px; background:linear-gradient(135deg,var(--rose),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .card { background:linear-gradient(135deg,rgba(255,45,85,0.1),rgba(155,89,182,0.1)); backdrop-filter:blur(20px); border:1px solid rgba(255,45,85,0.3); border-radius:20px; padding:30px; margin:20px 0; transition:all 0.3s; }
        .card:hover { transform:translateY(-5px); box-shadow:0 15px 30px rgba(255,45,85,0.3); }
        .card h2 { font-size:1.5rem; color:var(--gold); margin-bottom:15px; }
        .card p { font-size:1.1rem; line-height:1.8; }
        .card .icon { font-size:2.5rem; margin-bottom:10px; }
        .hearts { text-align:center; font-size:3rem; margin:30px 0; animation:heartbeat 1.5s ease-in-out infinite; }
        @keyframes heartbeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .timeline { position:relative; padding:20px 0; }
        .timeline::before { content:''; position:absolute; left:50%; transform:translateX(-50%); width:3px; height:100%; background:linear-gradient(to bottom,var(--rose),var(--gold)); }
        .timeline-item { position:relative; width:45%; padding:20px; background:rgba(255,45,85,0.1); border:1px solid rgba(255,45,85,0.3); border-radius:15px; margin-bottom:30px; }
        .timeline-item:nth-child(odd) { margin-left:5%; }
        .timeline-item:nth-child(even) { margin-left:50%; }
        .timeline-item::before { content:''; position:absolute; top:25px; width:15px; height:15px; background:var(--rose); border-radius:50%; border:3px solid var(--bg); }
        .timeline-item:nth-child(odd)::before { right:-28px; }
        .timeline-item:nth-child(even)::before { left:-28px; }
        .timeline-item h3 { color:var(--gold); margin-bottom:10px; }
        .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; }
        .gallery-item { background:rgba(255,45,85,0.1); border:1px solid rgba(255,45,85,0.3); border-radius:15px; overflow:hidden; text-align:center; padding:20px; }
        .gallery-item .emoji { font-size:4rem; }
        .gallery-item h3 { color:var(--gold); margin:10px 0; }
        .letter { background:rgba(255,45,85,0.08); border:1px solid rgba(255,45,85,0.3); border-radius:20px; padding:30px; line-height:2; }
        .letter p { margin-bottom:15px; }
        .signature { text-align:right; font-family:'Dancing Script',cursive; color:var(--pink); font-size:1.2rem; margin-top:20px; }
        footer { text-align:center; padding:40px 20px; background:linear-gradient(to top,rgba(10,0,21,0.9),transparent); margin-top:60px; }
        footer p { color:var(--pink); }
        .music-btn { position:fixed; bottom:20px; right:20px; z-index:1000; width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg,var(--rose),var(--purple)); border:none; cursor:pointer; font-size:1.5rem; box-shadow:0 5px 20px rgba(255,45,85,0.5); }
        @media(max-width:768px) {
            h1 { font-size:2rem; }
            nav a { font-size:0.85rem; padding:6px 12px; }
            .timeline::before { left:15px; }
            .timeline-item { width:85%; margin-left:10%!important; }
            .timeline-item::before { left:-25px!important; right:auto!important; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <nav>
        <ul>
            <li><a href="index.html" >首页</a></li>
            <li><a href="wishes.html" class="active">祝福</a></li>
            <li><a href="timeline.html" >时光轴</a></li>
            <li><a href="gallery.html" >相册</a></li>
            <li><a href="love.html" >告白</a></li>
        </ul>
    </nav>
    <div class="container">
        
<h1>🌹 温馨祝福 🌹</h1>
<div class="card"><div class="icon">💖</div><h2>致最爱的妈妈</h2><p>您的爱如春风般温暖，如阳光般明媚。<br>您的关怀如细雨般滋润，如明灯般指引。<br>感谢您给予我生命，感谢您无私的付出。</p></div>
<div class="card"><div class="icon">🌸</div><h2>感恩有您</h2><p>从我呱呱坠地的那一刻起，<br>您就用无尽的爱包围着我。<br>您的怀抱是我永远的港湾，<br>您的微笑是我最大的幸福。</p></div>
<div class="card"><div class="icon">✨</div><h2>美好祝愿</h2><p>愿您健康长寿，愿您幸福快乐，<br>愿您笑容常在，愿您一切顺遂。<br>愿时光温柔以待，愿岁月不染风霜。</p></div>
<div class="card"><div class="icon">🌷</div><h2>永远的依靠</h2><p>您是我迷茫时的灯塔，<br>您是我疲惫时的港湾，<br>您是我坚强的后盾，<br>妈妈，谢谢您！</p></div>

    </div>
    <footer><p>💖 母亲节快乐 · 永远爱您 💖</p></footer>
    <script>
        function createStars(){const c=document.getElementById('stars');for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s;`;c.appendChild(s);}}
        createStars();
        let playing=false,ctx,oscs=[],gains=[],ci=0;
        const chords=[[261.63,329.63,392,523.25],[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392]];
        function initAudio(){ctx=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<4;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime);o.connect(g);g.connect(ctx.destination);o.start();oscs.push(o);gains.push(g);}}
        function playChord(){if(!ctx)initAudio();const now=ctx.currentTime,c=chords[ci];oscs.forEach((o,i)=>{o.frequency.setValueAtTime(c[i],now);gains[i].gain.cancelScheduledValues(now);gains[i].gain.setValueAtTime(0,now);gains[i].gain.linearRampToValueAtTime(0.05/(i+1),now+0.15);gains[i].gain.exponentialRampToValueAtTime(0.01,now+1.8);});ci=(ci+1)%chords.length;if(playing)setTimeout(playChord,2000);}
        function toggleMusic(){if(playing){gains.forEach(g=>{g.gain.cancelScheduledValues(ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);});playing=false;}else{playChord();playing=true;}}
    </script>
</body>
</html>
